<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Vista previa · Tablero de Planta Línea Italia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  /* =========================================================================
     Vista previa estática del Tablero de Planta (Línea Italia).
     Recreación fiel en HTML/CSS/JS plano (sin build, sin dependencias
     externas) del dashboard React actual, calibrado a 995×543px.
     ========================================================================= */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #dfe3e8;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 40px 16px;
  }
  .page-caption { text-align: center; }
  .page-caption h1 { margin: 0 0 4px; font-size: 17px; font-weight: 800; color: #1f2937; }
  .page-caption p { margin: 0; font-size: 12.5px; color: #6b7280; }
  .page-caption code { background: #e5e7eb; padding: 1px 5px; border-radius: 4px; }

  .frame-shell {
    width: 995px; height: 543px; max-width: calc(100vw - 32px);
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(15,23,42,.35), 0 2px 10px rgba(15,23,42,.18);
    border: 1px solid rgba(15,23,42,.08);
  }

  /* ===== Paleta (misma que index.css real: mist/stone/ink/cloud + estados) === */
  .dash-root {
    --mist-500:#4a6c7e; --mist-600:#3a5667; --mist-700:#2f4654; --mist-800:#263844;
    --stone-50:#f6f5f2; --stone-100:#ecebe4;
    --ink-400:#9ca3af; --ink-500:#6b7280; --ink-800:#1f2937; --ink-900:#111827;
    --cloud-50:#f8fafc; --cloud-100:#f1f5f9; --cloud-200:#e2e8f0; --cloud-300:#cbd5e1;
    --ok-500:#16a34a; --ok-600:#15803d; --warn-500:#f59e0b; --warn-600:#d97706; --bad-500:#dc2626;
    --surface:#ffffff; --chip-bg: rgba(248,250,252,.7);
    height: 100%; width: 100%; display: flex; flex-direction: column;
    background: var(--stone-100); color: var(--ink-800); overflow: hidden;
  }
  .dash-root.tema-oscuro {
    --cloud-50:#181b21; --cloud-100:#14171c; --cloud-200:#2b3038; --cloud-300:#3a414b;
    --ink-400:#8a92a0; --ink-500:#a6adb8; --ink-800:#e7eaee; --ink-900:#f4f6f8;
    --stone-50:#14161a; --stone-100:#101216;
    --surface:#1e222a; --chip-bg: rgba(20,23,28,.6);
  }

  .tnum { font-variant-numeric: tabular-nums; }

  /* ===== Barra superior ===== */
  header.topbar { position: relative; z-index: 5; border-bottom: 1px solid var(--cloud-200); background: rgba(255,255,255,.95); flex-shrink: 0; }
  .dash-root.tema-oscuro header.topbar { background: rgba(30,34,42,.95); }
  .topbar-inner { position: relative; margin: 0 auto; width: 100%; max-width: 1024px; display: flex; flex-wrap: nowrap; align-items: center; padding: 12px; }
  .logo { height: 28px; width: auto; flex-shrink: 0; }
  .clock-wrap { position: absolute; left: 50%; transform: translateX(-50%); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .selector-wrap { position: relative; display: inline-flex; align-items: center; }
  select.centro-select {
    appearance: none; -webkit-appearance:none; cursor: pointer; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.7);
    background: linear-gradient(to bottom, rgba(255,255,255,.75), rgba(255,255,255,.35));
    padding: 4px 24px 4px 10px; font-size: 11.2px; font-weight: 600; color: var(--ink-800);
    box-shadow: 0 1px 6px rgba(38,56,68,.10); backdrop-filter: blur(12px);
    outline: none; font-family: inherit;
  }
  .selector-chevron { position: absolute; right: 8px; width: 12px; height: 12px; color: var(--ink-500); pointer-events: none; }

  button.toggle-tema { position: relative; display: inline-flex; align-items: center; height: 18px; width: 32px; border-radius: 9999px; background: #e5e7eb; border: none; cursor: pointer; transition: background-color .3s; padding: 0; }
  button.toggle-tema.on { background: #334155; }
  .toggle-thumb { position: absolute; left: 2px; display: flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 9999px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .3s; color: #f59e0b; }
  button.toggle-tema.on .toggle-thumb { transform: translateX(14px); color: #334155; }

  /* ===== Reloj de bloques (roll) ===== */
  .rlj { display: flex; align-items: center; gap: .4rem; }
  .rlj__block { position: relative; width: 2.05rem; height: 2.05rem; border-radius: .46rem; overflow: hidden; background: #fff; color: #6E7178; box-shadow: 0 2px 5px rgba(15,23,42,.16); }
  .rlj__block.bounce { animation: rlj-bounce .7s; }
  .rlj__block--sm { width: 1.55rem; height: 1.55rem; border-radius: .36rem; }
  .rlj__group { display: flex; flex-direction: column-reverse; height: 200%; }
  .rlj__group.roll { animation: rlj-roll .7s ease-in-out forwards; }
  .rlj__digits { height: 50%; display: flex; align-items: center; justify-content: center; font-size: .95rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .rlj__block--sm .rlj__digits { font-size: .52rem; letter-spacing: .01em; }
  .rlj__colon { font-size: .95rem; font-weight: 800; color: #0f172a; opacity: .5; }
  .dash-root.tema-oscuro .rlj__colon { color: #e7eaee; }
  @keyframes rlj-bounce { from, to { transform: translateY(0); } 50% { transform: translateY(10%); } }
  @keyframes rlj-roll { from { transform: translateY(-50%); } to { transform: translateY(0); } }

  /* ===== Cuerpo ===== */
  main.dash-main { margin: 0 auto; width: 100%; max-width: 1024px; flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 10px; min-height: 0; }

  .top-row { display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 8px; }

  .info-cards { display: flex; flex-direction: column; gap: 6px; height: 100%; }
  .stat-card { position: relative; display: flex; flex: 1; align-items: center; overflow: hidden; border-radius: 8px; border: 1px solid var(--cloud-200); background: var(--surface); padding: 6px 10px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .stat-ghost { position: absolute; bottom: -6px; right: -6px; opacity: .07; pointer-events: none; }
  .stat-ghost svg { width: 28px; height: 28px; }
  .stat-body { position: relative; min-width: 0; }
  .stat-label { font-size: 7.2px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--ink-500); white-space: nowrap; }
  .stat-value { font-size: 14px; font-weight: 800; line-height: 1; color: var(--ink-900); }
  .stat-unit { margin-left: 4px; font-size: 8px; font-weight: 500; color: var(--ink-400); }

  .semaforos-panel { display: flex; flex-direction: column; height: 100%; border-radius: 12px; border: 1px solid var(--cloud-200); background: var(--surface); padding: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .semaforos-panel h2 { margin: 0 0 4px; font-size: 10.4px; font-weight: 700; color: var(--ink-800); }
  .semaforos-list { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 2px; list-style: none; margin: 0; padding: 0; }
  .semaforo-row { display: flex; align-items: center; gap: 6px; border-radius: 8px; border: 1px solid var(--cloud-200); background: var(--surface); padding: 2px 6px; }
  .semaforo-row.estado-ok { box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 0 0 2px rgba(22,163,74,.4); }
  .semaforo-row.estado-warn { box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 0 0 2px rgba(245,158,11,.4); }
  .semaforo-row.estado-bad { box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 0 0 2px rgba(220,38,38,.4); }

  .tl-housing { display: inline-flex; align-items: center; gap: 4px; border-radius: 9999px; padding: 4px 8px; background: linear-gradient(145deg,#363b43 0%,#1b1e23 55%,#0f1114 100%); border: 1px solid rgba(0,0,0,.45); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -3px 6px rgba(0,0,0,.6), 0 3px 8px -2px rgba(0,0,0,.35); flex-shrink: 0; }
  .lamp { width: 6px; height: 6px; border-radius: 9999px; background: radial-gradient(circle at 35% 30%, #2c3037, #1a1c20 75%); box-shadow: inset 0 0 3px rgba(0,0,0,.9), inset 0 1px 1px rgba(255,255,255,.05); }
  .lamp.on-ok { background: radial-gradient(circle at 35% 30%, #4ade80, #16a34a 70%); box-shadow: 0 0 10px 2px rgba(34,197,94,.75), inset 0 0 3px rgba(255,255,255,.6); animation: lampPulse 2.4s ease-in-out infinite; }
  .lamp.on-warn { background: radial-gradient(circle at 35% 30%, #fcd34d, #f59e0b 70%); box-shadow: 0 0 10px 2px rgba(245,158,11,.75), inset 0 0 3px rgba(255,255,255,.6); animation: lampPulse 2.4s ease-in-out infinite; }
  .lamp.on-bad { background: radial-gradient(circle at 35% 30%, #f87171, #dc2626 70%); box-shadow: 0 0 10px 2px rgba(220,38,38,.75), inset 0 0 3px rgba(255,255,255,.6); animation: lampPulse 2.4s ease-in-out infinite; }
  @keyframes lampPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }

  .semaforo-info { min-width: 0; flex: 1; }
  .semaforo-area { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 9.6px; font-weight: 700; line-height: 1.2; color: var(--ink-900); }
  .semaforo-desde { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 8px; line-height: 1.2; color: var(--ink-400); }

  .programa-turno { border-radius: 12px; border: 1px solid var(--cloud-200); background: linear-gradient(to bottom, var(--stone-50), var(--cloud-100)); padding: 8px; }
  .programa-turno .pt-header { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; margin-bottom: 6px; }
  .programa-turno h2 { margin: 0; font-size: 11.2px; font-weight: 700; color: var(--ink-800); }
  .turno-badge { border-radius: 9999px; background: rgba(255,255,255,.7); padding: 2px 6px; font-size: 9.6px; font-weight: 600; color: var(--ink-500); box-shadow: 0 0 0 1px var(--cloud-200); }
  .dash-root.tema-oscuro .turno-badge { background: rgba(255,255,255,.08); }

  .kpi-rows { display: flex; flex-direction: column; gap: 4px; }
  .kpi-divider { border-top: 1px dashed var(--cloud-300); }
  .kpi-row { display: grid; grid-template-columns: repeat(5,1fr); gap: 4px; }
  .kpi-tile { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 38px; overflow: hidden; border-radius: 8px; border: 1px solid rgba(226,232,240,.8); background: linear-gradient(to bottom, var(--surface), var(--cloud-100)); padding: 4px 8px; }
  .kpi-tile::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(255,255,255,.7); }
  .kpi-label { font-size: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--ink-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi-value { margin-top: 2px; font-size: 14px; font-weight: 800; line-height: 1; }
  .kpi-mini { margin-top: 2px; display: block; height: 2px; width: 16px; border-radius: 9999px; opacity: .7; }
  .kpi-bar-track { margin-top: 2px; height: 4px; border-radius: 9999px; background: var(--cloud-200); overflow: hidden; }
  .kpi-bar-fill { height: 100%; border-radius: 9999px; }

  .tone-default { color: var(--ink-900); } .tone-accent { color: var(--mist-700); }
  .tone-ok { color: var(--ok-600); } .tone-warn { color: var(--warn-600); } .tone-bad { color: var(--bad-500); }
  .bg-default { background: var(--ink-400); } .bg-accent { background: var(--mist-500); }
  .bg-ok { background: var(--ok-500); } .bg-warn { background: var(--warn-500); } .bg-bad { background: var(--bad-500); }

  .lineas-produccion h2 { margin: 0 0 4px; font-size: 11.2px; font-weight: 700; color: var(--ink-800); }
  .lineas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .linea-card { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; gap: 8px; border-radius: 12px; border: 1px solid var(--cloud-200); background: var(--surface); padding: 6px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .linea-nombre { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; font-weight: 700; color: var(--ink-900); }
  .stat-chip { border-radius: 8px; border: 1px solid var(--cloud-200); background: var(--chip-bg); padding: 4px 8px; }
  .chip-head { display: flex; align-items: center; gap: 4px; color: var(--ink-400); }
  .chip-head svg { width: 10px; height: 10px; }
  .chip-head span { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; }
  .chip-value { font-size: 12px; font-weight: 700; line-height: 1; color: var(--ink-900); }
  .chip-unit { margin-left: 4px; font-size: 8.8px; font-weight: 500; color: var(--ink-400); }
</style>
</head>

              <div class="rlj__block" data-block="m1"><div class="rlj__group"><span class="rlj__digits"></span><span class="rlj__digits"></span></div></div>
              <span class="rlj__colon">:</span>
              <div class="rlj__block" data-block="s0"><div class="rlj__group"><span class="rlj__digits"></span><span class="rlj__digits"></span></div></div>
              <div class="rlj__block" data-block="s1"><div class="rlj__group"><span class="rlj__digits"></span><span class="rlj__digits"></span></div></div>
              <div class="rlj__block rlj__block--sm" data-block="ap"><div class="rlj__group"><span class="rlj__digits"></span><span class="rlj__digits"></span></div></div>
            </div>
          </div>

          <div class="topbar-right">
            <div class="selector-wrap">
              <select class="centro-select" id="centroSelect">
                <option selected>Ensamble de muebles</option>
                <option>Corte y habilitado</option>
                <option>Barnizado</option>
                <option>Tapicería</option>
              </select>
              <svg class="selector-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6" /></svg>
            </div>
            <button class="toggle-tema" id="temaToggle" aria-label="Cambiar tema claro u oscuro">
              <span class="toggle-thumb" id="temaThumb">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="8" height="8"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
              </span>
            </button>
          </div>
        </div>
      </header>

      <main class="dash-main">
        <div class="top-row">
          <div class="info-cards">
            <div class="stat-card">
              <span class="stat-ghost" style="color: var(--mist-600)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V10l6 4V10l6 4V6l6 4v11H3Z" /><path d="M7 21v-4M12 21v-4M17 21v-4" /></svg></span>
              <div class="stat-body">
                <p class="stat-label">Capacidad instalada</p>
                <p class="stat-value tnum">312<span class="stat-unit">pzs / hora</span></p>
              </div>
            </div>
            <div class="stat-card">
              <span class="stat-ghost" style="color: var(--ok-600)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5Z" /><path d="M3 13l9 5 9-5M3 16.5l9 5 9-5" /></svg></span>
              <div class="stat-body">
                <p class="stat-label">Líneas activas</p>
                <p class="stat-value tnum">1<span class="stat-unit">en operación</span></p>
              </div>
            </div>
            <div class="stat-card">
              <span class="stat-ghost" style="color: var(--ink-500)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2" /><path d="M3 9h18M8 2.5v4M16 2.5v4" /><rect x="7" y="12" width="4" height="4" rx="0.5" fill="currentColor" stroke="none" /></svg></span>
              <div class="stat-body">
                <p class="stat-label">Fecha actual</p>
                <p class="stat-value tnum">21/7/2026<span class="stat-unit">martes</span></p>
              </div>
            </div>
          </div>

          <section class="semaforos-panel">
            <h2>Semáforos de área</h2>
            <ul class="semaforos-list" id="semaforosList"></ul>
          </section>
        </div>

        <section class="programa-turno">
          <div class="pt-header">
            <h2>Programa del Turno</h2>
            <span class="turno-badge">Matutino · 21/7/2026</span>
          </div>
          <div class="kpi-rows" id="kpiRows"></div>
        </section>

        <section class="lineas-produccion">
          <h2>Líneas de Producción</h2>
          <div class="lineas-grid">
            <div class="linea-card">
              <h3 class="linea-nombre">Ensamble de muebles</h3>
              <div class="stat-chip">
                <div class="chip-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V10l6 4V10l6 4V6l6 4v11H3Z" /><path d="M7 21v-4M12 21v-4M17 21v-4" /></svg><span>Capacidad</span></div>
                <p class="chip-value tnum">312<span class="chip-unit">pzs/h</span></p>
              </div>
              <div class="stat-chip">
                <div class="chip-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2" /><circle cx="12" cy="12" r="2.5" /><path d="M6 9v6M18 9v6" /></svg><span>Costo</span></div>
                <p class="chip-value tnum">$10,000<span class="chip-unit">/min</span></p>
              </div>
            </div>
          </div>
        </section>
      </main>
  </div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // Datos (mismos valores que src/data/planta.js -> dashboardInicial)
  // ---------------------------------------------------------------------
  var programa = {
    programado: 123, atraso: 0, adelantadas: 0, totalAProducir: 123, fabricadas: 0,
    diferencia: -123, cumplimiento: 0, realVsIdeal: 100, ahorroActivos: 5400000, capInstalada: 312,
  };
  var fmtNum = new Intl.NumberFormat('es-MX');
  var fmtMoney = function (n) { return '$' + fmtNum.format(n); };
  var pct = function (n) { return fmtNum.format(n) + '%'; };

  var kpis = [
    { label: 'Programado', value: fmtNum.format(programa.programado), tone: 'default' },
    { label: 'Atraso', value: fmtNum.format(programa.atraso), tone: programa.atraso > 0 ? 'bad' : 'ok' },
    { label: 'Adelantadas', value: fmtNum.format(programa.adelantadas), tone: programa.adelantadas > 0 ? 'ok' : 'default' },
    { label: 'Total a producir', value: fmtNum.format(programa.totalAProducir), tone: 'default' },
    { label: 'Fabricadas', value: fmtNum.format(programa.fabricadas), tone: programa.fabricadas > 0 ? 'ok' : 'default' },
    { label: 'Diferencia', value: fmtNum.format(programa.diferencia), tone: programa.diferencia < 0 ? 'bad' : 'ok' },
    { label: 'Cumplimiento', value: pct(programa.cumplimiento), tone: programa.cumplimiento >= 100 ? 'ok' : programa.cumplimiento >= 85 ? 'warn' : 'bad', bar: programa.cumplimiento },
    { label: 'Real vs ideal', value: pct(programa.realVsIdeal), tone: 'accent', bar: programa.realVsIdeal },
    { label: 'Ahorro activos', value: fmtMoney(programa.ahorroActivos), tone: 'ok' },
    { label: 'Cap. instalada', value: fmtNum.format(programa.capInstalada), tone: 'accent' },
  ];

  var semaforos = [
    { area: 'Materia Prima', estado: 'ok', desde: '44d 18h' },
    { area: 'MOD', estado: 'ok', desde: '44d 18h' },
    { area: 'Programa', estado: 'ok', desde: '44d 18h' },
    { area: 'Calidad', estado: 'ok', desde: '44d 18h' },
    { area: 'Ingeniería', estado: 'ok', desde: '44d 18h' },
  ];

  // ---------------------------------------------------------------------
  // Render: Programa del Turno (2 filas de 5 + línea punteada)
  // ---------------------------------------------------------------------
  function tileHTML(k) {
    var bar = '';
    if (k.bar != null) {
      bar = '<div class="kpi-bar-track"><div class="kpi-bar-fill bg-' + k.tone + '" style="width:' + k.bar + '%"></div></div>';
    } else {
      bar = '<span class="kpi-mini bg-' + k.tone + '"></span>';
    }
    return '' +
      '<div class="kpi-tile" data-vshadow>' +
        '<span class="kpi-label">' + k.label + '</span>' +
        '<div><span class="kpi-value tnum tone-' + k.tone + '">' + k.value + '</span>' + bar + '</div>' +
      '</div>';
  }

  var fila1 = kpis.slice(0, 5).map(tileHTML).join('');
  var fila2 = kpis.slice(5, 10).map(tileHTML).join('');
  document.getElementById('kpiRows').innerHTML =
    '<div class="kpi-row">' + fila1 + '</div>' +
    '<div class="kpi-divider"></div>' +
    '<div class="kpi-row">' + fila2 + '</div>';

  // ---------------------------------------------------------------------
  // Render: Semáforos de área (carcasa horizontal: rojo, ámbar, verde)
  // ---------------------------------------------------------------------
  var ORDEN = ['bad', 'warn', 'ok'];
  function semaforoHTML(s) {
    var lamps = ORDEN.map(function (l) {
      return '<span class="lamp' + (s.estado === l ? ' on-' + l : '') + '"></span>';
    }).join('');
    return '' +
      '<li class="semaforo-row estado-' + s.estado + '">' +
        '<div class="tl-housing">' + lamps + '</div>' +
        '<div class="semaforo-info">' +
          '<p class="semaforo-area">' + s.area + '</p>' +
          '<p class="semaforo-desde">' + s.desde + '</p>' +
        '</div>' +
      '</li>';
  }
  document.getElementById('semaforosList').innerHTML = semaforos.map(semaforoHTML).join('');

  // ---------------------------------------------------------------------
  // Sombras con punto de fuga (misma fórmula que useVanishingShadows.js)
  // ---------------------------------------------------------------------
  function applyVanishingShadows() {
    var container = document.getElementById('kpiRows');
    var g = container.getBoundingClientRect();
    if (!g.width) return;
    var vpX = 0.5, vpY = -0.6, strength = 34, blur = 1.15;
    var color = 'rgba(38, 56, 68, 0.20)', ambient = '0 1px 2px rgba(17, 24, 39, 0.05)';
    var px = g.left + g.width * vpX;
    var py = g.top + g.height * vpY;
    var norm = Math.hypot(g.width, g.height) || 1;
    var tiles = container.querySelectorAll('[data-vshadow]');
    tiles.forEach(function (child) {
      var r = child.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var dx = cx - px, dy = cy - py;
      var d = Math.hypot(dx, dy) || 1;
      var t = Math.min(1, d / norm);
      var ox = (dx / d) * strength * t, oy = (dy / d) * strength * t;
      var b = 8 + strength * t * blur;
      var spread = -1 - t * 3;
      child.style.boxShadow = ox.toFixed(1) + 'px ' + oy.toFixed(1) + 'px ' + b.toFixed(1) + 'px ' + spread.toFixed(1) + 'px ' + color + ', ' + ambient;
    });
  }
  applyVanishingShadows();
  window.addEventListener('resize', applyVanishingShadows);

  // ---------------------------------------------------------------------
  // Reloj de bloques (mismo mecanismo que RelojBloques.jsx): 12h + AM/PM,
  // rebote + roll al cambiar cada dígito.
  // ---------------------------------------------------------------------
  var dosDig = function (n) { return n < 10 ? '0' + n : '' + n; };
  function horaEnBloques() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
    var ap = h < 12 ? 'AM' : 'PM';
    if (h === 0) h = 12; if (h > 12) h -= 12;
    var hh = dosDig(h), mm = dosDig(m), ss = dosDig(s);
    return { h0: hh[0], h1: hh[1], m0: mm[0], m1: mm[1], s0: ss[0], s1: ss[1], ap: ap };
  }

  var prevT = horaEnBloques();
  var blockEls = {};
  ['h0', 'h1', 'm0', 'm1', 's0', 's1', 'ap'].forEach(function (key) {
    blockEls[key] = document.querySelector('[data-block="' + key + '"]');
  });

  function paintBlock(el, a, b) {
    var digits = el.querySelectorAll('.rlj__digits');
    digits[0].textContent = a;
    digits[1].textContent = b;
  }
  function restartAnim(el) {
    // Reinicia las animaciones CSS quitando y re-agregando las clases (equivalente
    // al truco de "remount por key" que usa la versión React).
    var group = el.querySelector('.rlj__group');
    el.classList.remove('bounce'); group.classList.remove('roll');
    void el.offsetWidth; // fuerza reflow
    el.classList.add('bounce'); group.classList.add('roll');
  }

  // Pinta el estado inicial sin animar.
  (function initialPaint() {
    var t = prevT;
    paintBlock(blockEls.h0, t.h0, t.h0); paintBlock(blockEls.h1, t.h1, t.h1);
    paintBlock(blockEls.m0, t.m0, t.m0); paintBlock(blockEls.m1, t.m1, t.m1);
    paintBlock(blockEls.s0, t.s0, t.s0); paintBlock(blockEls.s1, t.s1, t.s1);
    paintBlock(blockEls.ap, t.ap, t.ap);
  })();

  function tick() {
    var t = horaEnBloques();
    ['h0', 'h1', 'm0', 'm1', 's0', 's1', 'ap'].forEach(function (key) {
      if (t[key] !== prevT[key]) {
        paintBlock(blockEls[key], prevT[key], t[key]);
        restartAnim(blockEls[key]);
        setTimeout((function (k, val) {
          return function () { paintBlock(blockEls[k], val, val); };
        })(key, t[key]), 720);
      }
    });
    prevT = t;
    setTimeout(tick, 1000 - (Date.now() % 1000));
  }
  setTimeout(tick, 1000 - (Date.now() % 1000));

  // ---------------------------------------------------------------------
  // Switch de tema claro/oscuro
  // ---------------------------------------------------------------------
  var root = document.getElementById('dashRoot');
  var toggle = document.getElementById('temaToggle');
  toggle.addEventListener('click', function () {
    var dark = root.classList.toggle('tema-oscuro');
    toggle.classList.toggle('on', dark);
    toggle.setAttribute('aria-checked', dark ? 'true' : 'false');
    var thumb = document.getElementById('temaThumb');
    thumb.innerHTML = dark
      ? '<svg viewBox="0 0 24 24" fill="currentColor" width="8" height="8"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" /></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="8" height="8"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>';
    thumb.style.color = dark ? '#334155' : '#f59e0b';
  });
})();

</script>
</body>
